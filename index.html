<!doctype html>
<html>
<head>
<link href="game.css" rel=stylesheet>
<title>Chimp Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- Settings Button -->
<button id="settings-btn" class="settings-btn" aria-label="Settings">⚙️</button>

<!-- Settings Menu -->
<div id="settings-menu" class="settings-menu">
  <div class="settings-content">
    <h2>Game Settings</h2>

    <div class="setting-group">
      <label for="setting-rows">Rows: <span id="rows-value">4</span></label>
      <input type="range" id="setting-rows" min="1" max="10" value="4" step="1">
    </div>

    <div class="setting-group">
      <label for="setting-cols">Columns: <span id="cols-value">4</span></label>
      <input type="range" id="setting-cols" min="1" max="10" value="4" step="1">
    </div>

    <div class="setting-group">
      <label for="setting-nums">Numbers: <span id="nums-value">7</span></label>
      <input type="range" id="setting-nums" min="1" max="100" value="7" step="1">
      <small>Max: <span id="nums-max">16</span></small>
    </div>

    <div class="setting-group checkbox-group">
      <label>
        <input type="checkbox" id="setting-timing" checked>
        Show timing in console
      </label>
    </div>

    <div class="setting-group checkbox-group">
      <label>
        <input type="checkbox" id="setting-hide-numbers">
        Hide numbers at start (click to reveal)
      </label>
    </div>

    <div class="setting-group checkbox-group">
      <label>
        <input type="checkbox" id="setting-show-graphs">
        Show performance graphs
      </label>
    </div>

    <div class="settings-buttons">
      <button id="apply-settings" class="btn btn-primary">Apply</button>
      <button id="reset-settings" class="btn btn-secondary">Reset to Default</button>
      <button id="close-settings" class="btn btn-secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- About Section -->
<div id="about" class="about-section">
  <div class="about-content">
    <h3>🧠 Chimp Memory Game</h3>
    <p>
      Inspired by <a href="https://www.youtube.com/channel/UC6nSFpj9HTCZ5t-N3Rm3-HA" target="_blank">Vsauce</a>
      <a href="https://www.youtube.com/playlist?list=PLZRRxQcaEjA4qyEuYfAMCazlL0vQDkIj2" target="_blank">Mind Field</a>
      S3 E1 <a href="https://www.youtube.com/watch?v=ktkjUjcZid0" target="_blank">The Cognitive Tradeoff Hypothesis</a>
    </p>
    <p>
      <strong>How to play:</strong> Click the numbers in order (1, 2, 3...). After clicking 1, all numbers disappear!
    </p>
    <p>
      <a href="https://github.com/dagelf/mindfield" target="_blank">📦 Fork on GitHub</a> |
      <a href="javascript:void(0)" onclick="document.getElementById('settings-btn').click()">⚙️ Settings</a>
    </p>
    <p class="note">Click anywhere on this message to hide it</p>
  </div>
</div>

<!-- Game Board -->
<div id="game"></div>

<!-- Stats Display (for future graphs) -->
<div id="viewtime"></div>
<div id="moves"></div>
<div id="games"></div>

<!-- Score Display -->
<div id="score"></div>

<script src="game.js"></script>
</body>
</html>
